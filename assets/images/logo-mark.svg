<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <g transform="translate(20, 15)">
    <!-- Tower Crane (Solid Gold) -->
    <g fill="#C8972E">
      <!-- Base -->
      <path d="M 12 216 L 72 216 L 66 202 L 18 202 Z" />
      <!-- Tower -->
      <rect x="34" y="68" width="22" height="136" rx="2" />
      <g fill="#FFFFFF">
        <circle cx="45" cy="84" r="4" />
        <circle cx="45" cy="106" r="4" />
        <circle cx="45" cy="128" r="4" />
        <circle cx="45" cy="150" r="4" />
        <circle cx="45" cy="172" r="4" />
        <circle cx="45" cy="194" r="4" />
      </g>
      <!-- Cab -->
      <rect x="24" y="48" width="42" height="20" rx="2" />
      <rect x="29" y="52" width="11" height="11" fill="#FFFFFF" />
      <!-- Peak -->
      <polygon points="45,14 32,48 58,48" />
      <!-- Back Jib -->
      <rect x="10" y="38" width="26" height="9" rx="1" />
      <rect x="6" y="35" width="14" height="15" rx="2" />
      <!-- Front Jib -->
      <rect x="45" y="38" width="195" height="8" rx="1" />
      <!-- Cables -->
      <line x1="45" y1="14" x2="14" y2="38" stroke="#C8972E" stroke-width="2.5" />
      <line x1="45" y1="14" x2="145" y2="38" stroke="#C8972E" stroke-width="2.5" />
      <line x1="45" y1="14" x2="225" y2="38" stroke="#C8972E" stroke-width="2.5" />
      <!-- Trolley -->
      <rect x="180" y="46" width="16" height="6" rx="1" fill="#162866" />
      <line x1="188" y1="52" x2="188" y2="100" stroke="#162866" stroke-width="2" />
      <ellipse cx="188" cy="104" rx="5" ry="5" fill="#C8972E" />
      <path d="M 188 109 L 188 117 A 4 4 0 0 1 184 121" fill="none" stroke="#162866" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Roof Chevrons -->
    <g>
      <polygon points="95,140 111,150 131,123 117,113" fill="#C8972E" />
      <polygon points="129,125 143,137 158,117 144,105" fill="#C8972E" />
      <polygon points="141,105 188,151 235,105 215,95 188,123 160,95" fill="#162866" />
      <circle cx="188" cy="124" r="6" fill="#C8972E" stroke="#FFFFFF" stroke-width="1.5" />
      <polygon points="237,105 259,141 289,119 267,103" fill="#C8972E" />
      <polygon points="261,140 283,135 306,115 286,120" fill="#162866" />
    </g>

    <!-- BRC Letters (Solid Navy) -->
    <g fill="#162866" transform="translate(85, 145)">
      <!-- B -->
      <path d="M 0 0 L 32 0 C 44 0 52 5 52 16 C 52 23 48 29 40 32 C 51 34 56 42 56 52 C 56 64 47 70 32 70 L 0 70 Z M 13 12 L 13 28 L 29 28 C 36 28 40 25 40 20 C 40 15 36 12 29 12 Z M 13 40 L 13 58 L 32 58 C 39 58 43 55 43 49 C 43 43 39 40 32 40 Z" />
      <!-- R -->
      <path d="M 72 0 L 105 0 C 119 0 128 7 128 20 C 128 31 120 38 108 40 L 132 70 L 115 70 L 93 42 L 85 42 L 85 70 L 72 70 Z M 85 12 L 85 30 L 103 30 C 111 30 115 27 115 21 C 115 15 111 12 103 12 Z" />
      <!-- C -->
      <path d="M 196 16 C 187 6 174 0 158 0 C 137 0 122 15 122 35 C 122 55 137 70 158 70 C 174 70 188 64 196 54 L 186 45 C 180 52 170 57 158 57 C 145 57 135 47 135 35 C 135 23 145 13 158 13 C 170 13 180 18 186 25 Z" />
    </g>

    <!-- Bottom Line -->
    <line x1="5" y1="230" x2="295" y2="230" stroke="#162866" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
