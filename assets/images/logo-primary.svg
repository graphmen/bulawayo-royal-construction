<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <style>
    .brand-main {
      font-family: 'Plus Jakarta Sans', 'Montserrat', 'Inter', -apple-system, sans-serif;
      font-weight: 800;
      fill: #162866;
      letter-spacing: 2px;
    }
    .brand-secondary {
      font-family: 'Plus Jakarta Sans', 'Montserrat', 'Inter', -apple-system, sans-serif;
      font-weight: 800;
      fill: #C8972E;
      letter-spacing: 3.5px;
    }
    .gold-solid { fill: #C8972E; }
    .navy-solid { fill: #162866; }
    .white-solid { fill: #FFFFFF; }
  </style>

  <!-- Left Icon Emblem (Optimized for High Visibility at Navbar Scale) -->
  <g transform="translate(6, 4)">
    <!-- Tower Crane (Bold Solid Gold) -->
    <g class="gold-solid">
      <!-- Crane Base -->
      <path d="M 2 78 L 26 78 L 22 72 L 6 72 Z" />
      
      <!-- Vertical Mast -->
      <rect x="10" y="24" width="8" height="48" rx="1" />
      
      <!-- Distinct High-Contrast Lattice Windows (Navy so they POP on white) -->
      <g fill="#162866">
        <rect x="12" y="29" width="4" height="4" rx="0.5" />
        <rect x="12" y="38" width="4" height="4" rx="0.5" />
        <rect x="12" y="47" width="4" height="4" rx="0.5" />
        <rect x="12" y="56" width="4" height="4" rx="0.5" />
        <rect x="12" y="65" width="4" height="4" rx="0.5" />
      </g>

      <!-- Crane Cab -->
      <rect x="7" y="16" width="15" height="8" rx="1" />
      <rect x="9" y="18" width="5" height="4" fill="#162866" />

      <!-- Mast Peak -->
      <polygon points="14,6 9,16 19,16" />

      <!-- Back Jib with Counterweight -->
      <rect x="2" y="12" width="10" height="4" rx="0.5" />
      <rect x="0" y="10" width="6" height="7" rx="1" />

      <!-- Horizontal Main Jib Boom -->
      <rect x="14" y="12" width="70" height="4" rx="0.5" />

      <!-- Bold Visible Pendants / Tie Cables -->
      <line x1="14" y1="6" x2="2" y2="12" stroke="#C8972E" stroke-width="1.8" stroke-linecap="round" />
      <line x1="14" y1="6" x2="48" y2="12" stroke="#C8972E" stroke-width="1.8" stroke-linecap="round" />
      <line x1="14" y1="6" x2="78" y2="12" stroke="#C8972E" stroke-width="1.8" stroke-linecap="round" />

      <!-- Crane Trolley & Cable (Navy for High Contrast) -->
      <rect x="58" y="15" width="8" height="3" fill="#162866" />
      <line x1="62" y1="18" x2="62" y2="35" stroke="#162866" stroke-width="2" />
      <ellipse cx="62" cy="38" rx="3.5" ry="3.5" fill="#C8972E" />
    </g>

    <!-- Architectural Roof Gables (Bold & Visible) -->
    <g>
      <!-- Left Gable (Gold) -->
      <polygon points="28,48 35,53 43,40 37,36" fill="#C8972E" />
      <polygon points="41,41 48,47 54,38 48,33" fill="#C8972E" />

      <!-- Center Grand Chevron (Navy with Gold Core) -->
      <polygon points="50,33 62,49 74,33 68,28 62,37 56,28" fill="#162866" />
      <circle cx="62" cy="38" r="2.8" fill="#C8972E" />

      <!-- Right Gable (Gold & Navy) -->
      <polygon points="74,33 83,48 95,38 86,30" fill="#C8972E" />
      <polygon points="84,47 93,44 100,35 93,37" fill="#162866" />
    </g>

    <!-- BRC Monogram Letters (Bold Royal Navy) -->
    <g fill="#162866" transform="translate(30, 48)">
      <!-- B -->
      <path d="M 0 0 L 14 0 C 20 0 24 3 24 8 C 24 11 22 13 18 15 C 23 16 26 19 26 24 C 26 30 21 33 13 33 L 0 33 Z M 6 6 L 6 13 L 13 13 C 16 13 18 12 18 9.5 C 18 7 16 6 13 6 Z M 6 18 L 6 27 L 14 27 C 17 27 19 25 19 22.5 C 19 20 17 18 14 18 Z" />
      
      <!-- R -->
      <path d="M 30 0 L 45 0 C 51 0 55 3 55 9 C 55 13 52 16 47 17 L 57 33 L 49 33 L 40 19 L 36 19 L 36 33 L 30 33 Z M 36 6 L 36 13 L 44 13 C 47 13 49 12 49 9.5 C 49 7 47 6 44 6 Z" />
      
      <!-- C -->
      <path d="M 85 8 C 81 3 75 0 68 0 C 58 0 51 8 51 16.5 C 51 25 58 33 68 33 C 76 33 82 29 85 24 L 79 20 C 76 23 72 26 68 26 C 62 26 57 22 57 16.5 C 57 11 62 7 68 7 C 73 7 77 9 80 12 Z" />
    </g>

    <!-- Baseline Ground Rule (Bold Navy) -->
    <line x1="2" y1="84" x2="116" y2="84" stroke="#162866" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Vertical Divider (Bold Solid Gold) -->
  <line x1="134" y1="12" x2="134" y2="78" stroke="#C8972E" stroke-width="2" stroke-linecap="round" />

  <!-- Typography Right Side (Clean, Bold, High Contrast) -->
  <g transform="translate(150, 10)">
    <text x="0" y="32" class="brand-main" font-size="23">BULAWAYO ROYAL</text>
    <text x="0" y="60" class="brand-secondary" font-size="19">CONSTRUCTION</text>
    <line x1="0" y1="70" x2="300" y2="70" stroke="#162866" stroke-width="1.8" />
  </g>
</svg>
